<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4fb;color:#171827}
#app{min-height:100vh;background:linear-gradient(180deg,#faf9ff,#f2f5fb);padding:22px 16px 32px}
.wrap{max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-weight:900;font-size:21px}.pill{background:#e9e6ff;color:#5546d8;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:800}
.card{background:white;border:1px solid #e7e7f0;border-radius:26px;padding:24px;box-shadow:0 12px 35px rgba(52,48,107,.08)}

.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;background:#6d5dfc;color:white}

.progress{height:8px;background:#e8e8f1;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#6d5dfc;width:0;transition:.25s}
.qmeta{display:flex;justify-content:space-between;color:#6e7080;font-size:13px;font-weight:700}.timer{font-size:18px;color:#6d5dfc}
.word{font-size:42px;text-align:center;margin:30px 0 24px;font-weight:900;letter-spacing:-1px}
.options{display:grid;gap:10px}.opt{padding:16px;border:2px solid #e9e9f2;border-radius:16px;background:#fff;text-align:left;font-size:16px;font-weight:700;cursor:pointer}
.opt.correct{border-color:#38a169;background:#edf9f2}.opt.wrong{border-color:#e05252;background:#fff0f0}
.hidden{display:none!important}.score{font-size:64px;font-weight:900;color:#6d5dfc;text-align:center;margin:15px 0}
.small{font-size:12px;color:#77798b;text-align:center;margin-top:12px}

<body>
<div id="app"><div class="wrap">
<div class="top"><div class="logo">WORD SPRINT 500</div><div class="pill">AR 4.0–5.0</div></div>

<section id="home" class="card">
<h1>영어 단어<br>20문제 챌린지</h1>
<p class="sub">500개의 영어 단어 중 매 게임 20개가 랜덤으로 출제됩니다. 제한 시간 안에 정확한 뜻을 골라보세요.</p>
<div class="row">
<div class="setting"><label>문제당 시간</label>
<select id="time"><option value="10">10초</option><option value="15" selected>15초</option><option value="20">20초</option><option value="30">30초</option></select></div>
<div class="setting"><label>문제 수</label><select disabled><option>20문제</option></select></div>
</div>
<button class="btn" style="margin-top:16px" onclick="startGame()">게임 시작</button>
<p class="small">Safari에서 홈 화면에 추가하면 앱처럼 사용할 수 있습니다.</p>
</section>

<section id="game" class="card hidden">
<div class="qmeta"><span id="count">1 / 20</span><span class="timer">⏱ <b id="timer">15</b></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="word" id="word"></div>
<div class="options" id="options"></div>
</section>

<section id="result" class="card hidden">
<div style="text-align:center"><div class="pill" style="display:inline-block">QUIZ COMPLETE</div>
<h1>퀴즈 완료!</h1><div class="score" id="score">0 / 20</div><p id="message" class="sub"></p></div>
<button class="btn" onclick="startGame()">다시 도전</button>
<button class="btn" style="margin-top:10px;background:#eeeef7;color:#292a39" onclick="goHome()">홈으로</button>
</section>
</div></div>

let questions=[],idx=0,score=0,timerId=null,locked=false,remaining=15;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function startGame(){
 questions=shuffle(VOCAB).slice(0,20);idx=0;score=0;
 home.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');showQuestion();
}
function showQuestion(){
 clearInterval(timerId);locked=false;
 const q=questions[idx],limit=Number(time.value);remaining=limit;
 timer.textContent=remaining;count.textContent=(idx+1)+' / 20';bar.style.width=(idx/20*100)+'%';word.textContent=q.word;
 const wrong=shuffle(VOCAB.filter(x=>x.word!==q.word)).slice(0,3).map(x=>x.meaning);
 options.innerHTML=shuffle([q.meaning,...wrong]).map((c,i)=>`<button class="opt" data-i="${i}" onclick="answer(this)">${c}</button>`).join('');
 timerId=setInterval(()=>{remaining--;timer.textContent=remaining;if(remaining<=0){clearInterval(timerId);answer(null)}},1000);
}
function answer(btn){
 if(locked)return;locked=true;clearInterval(timerId);
 const q=questions[idx],choice=btn?btn.textContent:null;
 if(choice===q.meaning)score++;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.meaning)b.classList.add('correct')});
 if(btn&&choice!==q.meaning)btn.classList.add('wrong');
 setTimeout(()=>{idx++;idx<20?showQuestion():finish()},550);
}
function finish(){
 game.classList.add('hidden');result.classList.remove('hidden');scoreEl=document.getElementById('score');scoreEl.textContent=score+' / 20';
 document.getElementById('message').textContent=score>=18?'훌륭해요! 단어 실력이 아주 좋아요.':score>=14?'좋아요! 조금만 더 복습하면 더 높은 점수를 받을 수 있어요.':'괜찮아요! 다시 도전하면서 단어를 익혀보세요.';
}
